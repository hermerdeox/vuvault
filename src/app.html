<!doctype html>
<html lang="en" data-theme="modern" data-audience="user" data-vp="lg desktop">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="referrer" content="no-referrer" />

		<!-- Favicons -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/icons/icon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />

		<!-- iOS -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="VuVault" />

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#000000" />

		<!-- SEO -->
		<meta name="description" content="VuVault — zero-knowledge password manager. Mathematical privacy, not policy. Quantum-safe by construction." />

		<!-- Open Graph -->
		<meta property="og:title" content="VuVault — Zero-knowledge password manager" />
		<meta property="og:description" content="Zero-knowledge password manager. Mathematical privacy, not policy. Quantum-safe by construction." />
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:type" content="website" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="VuVault — Zero-knowledge password manager" />
		<meta name="twitter:description" content="Zero-knowledge password manager. Mathematical privacy, not policy. Quantum-safe by construction." />
		<meta name="twitter:image" content="/twitter-card.png" />

		<!--
			Preload the two Latin font subsets used on every route's
			first paint (Instrument Sans, weight 400, latin; Instrument
			Serif, weight 400 normal, latin). Non-Latin subsets and
			JetBrains Mono are demand-loaded only when the matching
			Unicode range is referenced (per `src/lib/styles/fonts.css`).
			Without this preload the browser only discovers the font URLs
			after `0.CpJaTATP.css` is parsed, adding ~200-400 ms LCP on
			slow links.
		-->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
			href="%sveltekit.assets%/fonts/instrument-sans-31fe1ea2.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
			href="%sveltekit.assets%/fonts/instrument-serif-51cc973f.woff2"
		/>

		<!-- FOUC prevention: read theme + audience + viewport class before first paint. -->
		<!-- SvelteKit hashes this inline script for prerendered pages -->
		<!-- and assigns a nonce for SSR pages automatically. -->
		<script>
			(function () {
				var root = document.documentElement;
				try {
					var t = localStorage.getItem('vuvault-theme');
					root.setAttribute('data-theme', t === 'brutalist' ? 'brutalist' : 'modern');
				} catch (e) {
					root.setAttribute('data-theme', 'modern');
				}
				try {
					var a = localStorage.getItem('vuvault-audience');
					root.setAttribute('data-audience', a === 'tech' ? 'tech' : 'user');
				} catch (e) {
					root.setAttribute('data-audience', 'user');
				}

				// Viewport class — mirrors src/lib/styles/breakpoints.css.
				// Whitespace-separated tokens consumed by `[data-vp~='xs']`,
				// `[data-vp~='mobile']` etc. Set before first paint so the
				// CSS-only content-reduction (`[data-vp-show='desktop']`)
				// does not flash long copy on small phones.
				function computeVp() {
					var w = window.innerWidth || document.documentElement.clientWidth || 0;
					var h = window.innerHeight || document.documentElement.clientHeight || 0;
					var size = w < 480 ? 'xs mobile'
						: w < 720 ? 'sm mobile'
						: w < 1024 ? 'md tablet'
						: w < 1200 ? 'lg desktop'
						: 'xl lg desktop';
					if (h < 700) size += ' short';
					return size;
				}
				root.setAttribute('data-vp', computeVp());

				// Debounced (rAF-coalesced) resize handler so rotation +
				// iOS Safari address-bar collapse keep the attribute fresh
				// without thrashing layout. visualViewport is preferred on
				// mobile because window.innerHeight lies during keyboard
				// open / address-bar transitions.
				var raf = 0;
				function onResize() {
					if (raf) return;
					raf = requestAnimationFrame(function () {
						raf = 0;
						var next = computeVp();
						if (root.getAttribute('data-vp') !== next) {
							root.setAttribute('data-vp', next);
						}
					});
				}
				window.addEventListener('resize', onResize, { passive: true });
				window.addEventListener('orientationchange', onResize, { passive: true });
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', onResize, { passive: true });
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
