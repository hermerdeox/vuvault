<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Apple-style squircle clip (continuous curvature) -->
    <clipPath id="squircle">
      <path d="
        M 512 0
        C 717.5 0, 823.5 0, 893.3 41.2
        C 940.8 68.6, 955.4 83.2, 982.8 130.7
        C 1024 200.5, 1024 306.5, 1024 512
        C 1024 717.5, 1024 823.5, 982.8 893.3
        C 955.4 940.8, 940.8 955.4, 893.3 982.8
        C 823.5 1024, 717.5 1024, 512 1024
        C 306.5 1024, 200.5 1024, 130.7 982.8
        C 83.2 955.4, 68.6 940.8, 41.2 893.3
        C 0 823.5, 0 717.5, 0 512
        C 0 306.5, 0 200.5, 41.2 130.7
        C 68.6 83.2, 83.2 68.6, 130.7 41.2
        C 200.5 0, 306.5 0, 512 0
        Z"/>
    </clipPath>

    <!-- Deep navy background -->
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#12243f"/>
      <stop offset="52%" stop-color="#081325"/>
      <stop offset="100%" stop-color="#03070f"/>
    </radialGradient>

    <!-- Top cyan dome wash -->
    <radialGradient id="dome" cx="50%" cy="-4%" r="62%">
      <stop offset="0%" stop-color="#3ea8ff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#3ea8ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3ea8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed-steel ring gradient: diagonal sheen, never pure white -->
    <linearGradient id="steel" x1="18%" y1="2%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#eef3f9"/>
      <stop offset="26%" stop-color="#c3cedd"/>
      <stop offset="55%" stop-color="#8b97a8"/>
      <stop offset="80%" stop-color="#586473"/>
      <stop offset="100%" stop-color="#3a4452"/>
    </linearGradient>

    <!-- Lighter steel for the grip teeth -->
    <linearGradient id="steelTooth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4dde9"/>
      <stop offset="100%" stop-color="#5b6675"/>
    </linearGradient>

    <!-- Dark gunmetal dial face -->
    <radialGradient id="face" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#243345"/>
      <stop offset="60%" stop-color="#141d2a"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </radialGradient>

    <!-- Cyan keyhole core -->
    <radialGradient id="cyanCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#aef6ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#34d6ff"/>
      <stop offset="100%" stop-color="#00aee6"/>
    </radialGradient>

    <!-- Soft glow for the cyan halo + keyhole -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softS" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#dome)"/>

    <!-- Cyan halo behind the dial -->
    <circle cx="512" cy="524" r="300" fill="#00d4ff" opacity="0.20" filter="url(#soft)"/>

    <!-- Cast shadow under the dial -->
    <ellipse cx="512" cy="812" rx="232" ry="30" fill="#000000" opacity="0.45" filter="url(#soft)"/>

    <g transform="translate(512,512)">
      <!-- 24 dial grip teeth around the rim -->
      <g fill="url(#steelTooth)">
        <g><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(15)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(30)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(45)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(60)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(75)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(90)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(105)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(120)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(135)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(150)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(165)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(180)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(195)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(210)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(225)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(240)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(255)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(270)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(285)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(300)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(315)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(330)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
        <g transform="rotate(345)"><rect x="-7" y="-368" width="14" height="34" rx="5"/></g>
      </g>

      <!-- Outer steel ring (the safe door rim) -->
      <circle r="305" fill="none" stroke="url(#steel)" stroke-width="78"/>
      <!-- Crisp inner + outer edges for definition -->
      <circle r="344" fill="none" stroke="#111a28" stroke-width="3" stroke-opacity="0.7"/>
      <circle r="266" fill="none" stroke="#0a1018" stroke-width="3" stroke-opacity="0.8"/>

      <!-- Inner gunmetal face -->
      <circle r="262" fill="url(#face)"/>
      <!-- Face bevel rim -->
      <circle r="258" fill="none" stroke="#46556a" stroke-width="3" stroke-opacity="0.6"/>
      <circle r="230" fill="none" stroke="#2b3848" stroke-width="2" stroke-opacity="0.5"/>

      <!-- Index marker at 12 o'clock -->
      <path d="M 0 -300 l 16 30 l -32 0 Z" fill="#34d6ff"/>

      <!-- Cyan keyhole glow -->
      <g filter="url(#softS)">
        <circle cx="0" cy="-22" r="58" fill="#00d4ff" opacity="0.55"/>
        <rect x="-26" y="-22" width="52" height="150" rx="26" fill="#00d4ff" opacity="0.45"/>
      </g>
      <!-- Keyhole solid -->
      <circle cx="0" cy="-22" r="50" fill="url(#cyanCore)"/>
      <path d="M -20 8 L -34 118 Q -34 138 0 138 Q 34 138 34 118 L 20 8 Z" fill="url(#cyanCore)"/>
      <!-- Keyhole inner shadow dot for depth -->
      <circle cx="0" cy="-26" r="22" fill="#063246" opacity="0.55"/>

      <!-- Specular sheen on the ring (top-left) -->
      <path d="M -232 -198 A 305 305 0 0 1 198 -232"
            fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.30"
            stroke-linecap="round" filter="url(#softS)"/>
    </g>

    <!-- Inner tile bezel -->
    <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none"
          stroke="#000000" stroke-width="3" stroke-opacity="0.45"/>
  </g>
</svg>
