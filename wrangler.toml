name = "vuvault"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# ============================================================
# DEFAULT (PREVIEW) BINDINGS
# ============================================================
# These bindings are used for `wrangler pages dev` (local preview)
# and for non-production deploys. The release workflow targets the
# `production` environment below by passing `--env production` /
# `--branch main` so production traffic is isolated.
#
# Production deploys MUST set `PUBLIC_BUNDLE_HASH` from the release
# workflow's pass-2 digest — never the placeholder. `PUBLIC_SYNC_ORIGIN`
# is likewise injected by the release workflow. Do not declare those two
# vars here: Wrangler warns when a top-level var is absent from
# `[env.production.vars]`, but adding placeholder production values would
# make manual deploys dangerous.

[vars]
PUBLIC_VAULT_VERSION = "0.1.0"
# Production builds MUST leave demo auth disabled. CI verifies this.
PUBLIC_ENABLE_DEMO_AUTH = "false"
PUBLIC_M3_E2E_AUTH = "false"
# Preview/local development cannot receive Pages dashboard rate-limit
# bindings, so it stays fail-open. Production pins this to fail-closed.
OPAQUE_RATE_LIMIT_MODE = "fail-open"

# D1 binding — OPAQUE record storage + sessions + device pairings.
# Local development uses Wrangler's auto-provisioned local SQLite
# under `.wrangler/state`. Production overrides via `[env.production]`
# with a real database_id. Migrations live under `migrations/` at the
# repo root and are applied via
# `wrangler d1 migrations apply AUTH_DB --env <env>`.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "vuvault-auth-preview"
database_id = "preview-placeholder-id"
migrations_dir = "migrations"

# R2 binding — opaque encrypted vault blobs. Server holds ciphertext
# only; AES-256-GCM under the v2 hybrid envelope is performed
# client-side by `vault-session.ts`. Server-side R2 encryption-at-rest
# is additional defense-in-depth, never relied upon.
[[r2_buckets]]
binding = "VAULT_BLOBS"
bucket_name = "vuvault-blobs-preview"

# Rate limiting is D1-backed for Pages compatibility. Wrangler's Pages
# schema cannot represent Cloudflare Rate Limiting bindings, so
# `src/lib/server/api/rate-limit-d1.ts` stores sliding-window counters
# in AUTH_DB.rate_limits:
#   - opaque-register : 10 req / 60 s, key = client IP
#   - opaque-login    : 30 req / 60 s, key = client IP
#   - blob            : 30 req / 60 s, key = accountId
# Apply migrations before deploying API routes that call the limiter.

# ============================================================
# PRODUCTION ENV
# ============================================================
# Selected via `wrangler pages deploy --env=production` or the
# release workflow's `--branch=main` flag. The database_id and
# bucket_name MUST be different from the preview environment so a
# botched deploy can never read or overwrite preview state.

[env.production.vars]
PUBLIC_VAULT_VERSION = "0.1.0"
PUBLIC_ENABLE_DEMO_AUTH = "false"
PUBLIC_M3_E2E_AUTH = "false"
OPAQUE_RATE_LIMIT_MODE = "fail-closed"
# `PUBLIC_BUNDLE_HASH` and `PUBLIC_SYNC_ORIGIN` are injected at deploy
# time by `.github/workflows/release.yml`. We deliberately do NOT
# bake them into this file so a manual `wrangler pages deploy`
# without the workflow's env-var pass cannot ship a placeholder hash
# to production.

[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "vuvault-auth-production"
database_id = "6573b583-f483-489d-8faf-2b72b1040fbc"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "VAULT_BLOBS"
bucket_name = "vuvault-blobs-production"

# Rate limits use AUTH_DB.rate_limits; see the explanatory comment in
# the default binding section above.

# `[build]` block — REMOVED. Wrangler 4.90 Pages-config validation
# rejects it. The build command for Pages comes from the dashboard
# project settings (Settings > Build & deployments > Build command =
# `npm run build`). The release workflow runs `npm run build` itself
# before invoking `wrangler pages deploy`, so the dashboard build
# command is only used by Cloudflare Pages' own webhook-driven
# rebuilds (which we don't currently rely on).
